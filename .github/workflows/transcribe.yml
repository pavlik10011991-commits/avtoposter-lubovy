name: Расшифровка голоса
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['media/**/voice*.m4a']
permissions:
  contents: write
jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q faster-whisper
      - name: Расшифровка
        run: |
          python - <<'PY'
          import glob, json, os
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8")
          for f in glob.glob("media/**/voice*.m4a", recursive=True):
              out = f.rsplit(".", 1)[0] + ".words.json"
              if os.path.exists(out): continue
              segs, _ = m.transcribe(f, language="ru", word_timestamps=True, vad_filter=False)
              words = [{"w": w.word.strip(), "s": round(w.start, 2), "e": round(w.end, 2)} for s in segs for w in s.words]
              json.dump(words, open(out, "w"), ensure_ascii=False, indent=0)
              print(f, " ".join(x["w"] for x in words))
          PY
      - run: |
          git config user.name "autoposter"; git config user.email "autoposter@users.noreply.github.com"
          git add media; git commit -qm "расшифровка голоса" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
