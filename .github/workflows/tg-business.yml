name: Подключить сторис в личный Телеграм
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python publisher/tg_business_connect.py 2>&1 | tee out.txt; code=${PIPESTATUS[0]}; { echo "```"; cat out.txt; echo "```"; } >> "$GITHUB_STEP_SUMMARY"; cp out.txt media/tg_business_log.txt; git config user.name autoposter; git config user.email autoposter@users.noreply.github.com; git add media/tg_business_log.txt; git commit -qm "tg-business log" && git push -q; exit $code
