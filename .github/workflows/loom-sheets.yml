name: Раскадровка Loom
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "id через пробел"
        required: true
      every:
        description: "кадр каждые N секунд"
        default: "15"
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
      - name: Раскадровка
        env:
          IDS: ${{ inputs.ids }}
          EVERY: ${{ inputs.every }}
        run: |
          set +e
          mkdir -p media/loom/sheets
          one() {
            id=$1; s=${id:0:4}
            url=""
            for ep in transcoded-url raw-url; do
              u=$(curl -s -X POST "https://www.loom.com/api/campaigns/sessions/$id/$ep" -H 'content-type: application/json' \
                  -d '{"anonID":null,"deviceID":null,"force_original":false,"password":null}' | python3 -c "import json,sys;print(json.load(sys.stdin).get('url',''))" 2>/dev/null)
              [ -n "$u" ] && { url="$u"; break; }
            done
            [ -z "$url" ] && { echo "$id no url"; return; }
            src="$url"; opts=""
            if [[ "$url" == *.m3u8* ]]; then
              base="${url%%\?*}"; base="${base%/*}"; q="?${url#*\?}"
              curl -s "$url" > m_$s.m3u8
              vpl=$(grep -v '^#' m_$s.m3u8 | grep video | head -1)
              curl -s "$base/$vpl$q" | B="$base" Q="$q" python3 -c "import os,sys;b,q=os.environ['B'],os.environ['Q'];print(''.join(l if l.startswith('#') or not l.strip() else f'{b}/{l.strip()}{q}\n' for l in sys.stdin))" > v_$s.m3u8
              src=v_$s.m3u8; opts="-protocol_whitelist file,https,tcp,tls,crypto -allowed_extensions ALL"
            fi
            ffmpeg -loglevel error -y $opts -i "$src" -an -vf "fps=1/$EVERY,scale=400:-1,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='%{pts\:hms}':x=4:y=4:fontsize=22:fontcolor=yellow:box=1:boxcolor=black@0.7,tile=5x4" media/loom/sheets/${s}_%02d.jpg
            echo "$id done $(ls media/loom/sheets/${s}_* | wc -l)"
          }
          for id in $IDS; do one $id & done; wait
          # время в раскадровке считается от 0 с шагом EVERY: кадр k (0..) = k*EVERY секунд
      - name: Сохранить
        if: always()
        run: |
          git config user.name "autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          git add media/loom/sheets
          git commit -qm "Раскадровка Loom" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
