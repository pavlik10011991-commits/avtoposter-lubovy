name: Проверка самозапуска
on:
  push:
    branches: [main]
    paths: [.github/workflows/selftest.yml]
permissions:
  actions: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -w "HTTP %{http_code}\n" -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish.yml/dispatches" -d '{"ref":"main","inputs":{"mode":"check"}}'
