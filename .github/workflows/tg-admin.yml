name: Подключить личку Любы к боту
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/tg-admin.trigger"]
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python publisher/tg_admin_connect.py 2>&1 | tee out.txt; code=${PIPESTATUS[0]}; { echo "~~~"; cat out.txt; echo "~~~"; } >> "$GITHUB_STEP_SUMMARY"; git pull -q --rebase || true; cp out.txt media/tg_admin_log.txt; git config user.name autoposter; git config user.email autoposter@users.noreply.github.com; git add media/tg_admin_log.txt; git commit -qm "tg-admin log" && git push -q; exit $code
