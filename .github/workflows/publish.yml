name: Автопостер

on:
  schedule:
    - cron: "0 16 * * *"          # каждый день в 19:00 по Москве (16:00 UTC); GitHub может задержать запуск на 5–30 мин
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим"
        type: choice
        options: [publish, check, check-setup]
        default: check
      only_id:
        description: "id строки — опубликовать только её прямо сейчас (для теста)"
        required: false

permissions:
  contents: write

concurrency:
  group: autoposter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MAX_LATE_HOURS: "24"
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHANNEL: ${{ vars.TG_CHANNEL || secrets.TG_CHANNEL }}
      TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID || secrets.TG_ADMIN_CHAT_ID }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID || secrets.IG_USER_ID }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null || true

      - name: Проверка подключения
        if: github.event.inputs.mode == 'check-setup'
        run: python publisher/check_setup.py

      - name: Проверка плана (без публикации)
        if: github.event.inputs.mode == 'check'
        run: python publisher/publish.py --check

      - name: Публикация
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'publish'
        env:
          ONLY_ID: ${{ github.event.inputs.only_id }}
        run: |
          if [ -n "$ONLY_ID" ]; then
            python publisher/publish.py --only "$ONLY_ID"
          else
            python publisher/publish.py
          fi

      - name: Сохранить журнал публикаций
        if: always() && (github.event_name == 'schedule' || github.event.inputs.mode == 'publish')
        run: |
          git config user.name "autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          git add status.csv
          git diff --cached --quiet && exit 0
          git commit -m "журнал: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
