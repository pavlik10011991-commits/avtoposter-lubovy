name: Продление токена Инстаграма

on:
  schedule:
    - cron: "0 6 1,15 * *"   # 1-го и 15-го числа — с запасом до 60 дней
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Продлить токен
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OUT: ${{ runner.temp }}/t.txt
        run: python publisher/refresh_ig_token.py
      - name: Записать новый токен в секреты
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::Нет секрета GH_PAT — новый токен не сохранён"; exit 1; fi
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "${{ runner.temp }}/t.txt"
          rm -f "${{ runner.temp }}/t.txt"
