name: Проверка самозапуска
on:
  push:
    branches: [main]
    paths: [".github/dispatch-test.trigger"]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name autoposter; git config user.email autoposter@users.noreply.github.com
          date -u > media/pat_push_test.txt; git add media/pat_push_test.txt; git commit -qm "PAT push test"
          git pull --rebase -q
          if git push -q "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git" HEAD:main 2>err.txt; then r=OK; else r="FAIL $(cat err.txt)"; fi
          echo "$(date -u) push via PAT: $r" > media/dispatch_log.txt
          git add media/dispatch_log.txt; git commit -qm "dispatch test log"; git pull --rebase -q; git push -q
